<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MedAI Platform - منصة الطب الذكية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  :root{
    --primary:#2563eb;
    --primary-light:#60a5fa;
    --secondary:#7c3aed;
    --bg-light:#f8fafc;
    --text-main:#0f172a;
    --text-muted:#475569;
    --glass-bg:rgba(255,255,255,0.85);
    --glass-border:rgba(255,255,255,0.5);
    --card-shadow:0 10px 40px -10px rgba(0,0,0,0.08);
  }
  *{box-sizing:border-box;}
  html,body,#root{height:100%;}
  body{
    font-family:'Cairo',sans-serif;
    background-color:var(--bg-light);
    color:var(--text-main);
    overflow-x:hidden;
    direction:rtl;
    margin:0;
  }
  .bg-animated{
    background:radial-gradient(circle at top left,#e0f2fe,#f8fafc,#ede9fe);
    background-size:400% 400%;
    animation:gradientBG 15s ease infinite;
    position:fixed;inset:0;width:100vw;height:100vh;z-index:-1;
  }
  @keyframes gradientBG{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
  .glass-card{
    background:var(--glass-bg);
    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);
    border:1px solid var(--glass-border);
    box-shadow:var(--card-shadow);
    border-radius:1.5rem;
  }
  .glass-input{
    background:rgba(255,255,255,0.9);
    border:1px solid #e2e8f0;
    color:var(--text-main);
    transition:all .3s ease;
  }
  .glass-input:focus{
    outline:none;
    border-color:var(--primary);
    box-shadow:0 0 0 3px rgba(37,99,235,0.2);
    background:#fff;
  }
  ::-webkit-scrollbar{width:8px;height:8px;}
  ::-webkit-scrollbar-track{background:transparent;}
  ::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:10px;}
  .fade-in{animation:fadeIn .8s ease forwards;}
  .slide-up{animation:slideUp .6s ease forwards;}
  .scale-in{animation:scaleIn .5s ease forwards;}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  @keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
  @keyframes scaleIn{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:scale(1)}}
  .floating{animation:floating 4s ease-in-out infinite;}
  @keyframes floating{0%{transform:translateY(0)}50%{transform:translateY(-12px)}100%{transform:translateY(0)}}
  .loader{
    border:3px solid #e2e8f0;
    border-bottom-color:var(--primary);
    border-radius:50%;
    display:inline-block;
    box-sizing:border-box;
    animation:rotation 1s linear infinite;
  }
  @keyframes rotation{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
  .typing-dots span{
    display:inline-block;width:8px;height:8px;margin:0 2px;border-radius:50%;
    background:#93c5fd;animation:bounceDot 1.2s infinite ease-in-out;
  }
  .typing-dots span:nth-child(2){animation-delay:.15s}
  .typing-dots span:nth-child(3){animation-delay:.3s}
  @keyframes bounceDot{0%,80%,100%{transform:translateY(0);opacity:.5}40%{transform:translateY(-7px);opacity:1}}
  .msg-bubble{white-space:pre-wrap;word-break:break-word;line-height:1.9;}
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef, useCallback } = React;

/* ============================================================
   ⚙️  الإعدادات — ضع مفاتيح Gemini هنا (اختياري)
   الأفضل: اتركها فارغة وأضف المفتاح من زر الإعدادات داخل الموقع
   ============================================================ */
const DEFAULT_API_KEYS = [
  // "AIzaSy....................",
];

const MODELS = [
  "gemini-2.5-flash",
  "gemini-2.0-flash",
  "gemini-flash-latest"
];

const STORAGE_KEYS = "medai_api_keys";
const STORAGE_USER = "medai_user";

/* -------------------- إدارة المفاتيح -------------------- */
const readStoredKeys = () => {
  try {
    const raw = JSON.parse(localStorage.getItem(STORAGE_KEYS) || "[]");
    return Array.isArray(raw) ? raw : [];
  } catch (e) {
    return [];
  }
};

const getApiKeys = () => {
  const all = [...readStoredKeys(), ...DEFAULT_API_KEYS]
    .map(k => (k || "").trim())
    .filter(k => k && !k.startsWith("YOUR_"));
  return [...new Set(all)];
};

const saveApiKeys = (keys) => {
  const clean = [...new Set(keys.map(k => (k || "").trim()).filter(Boolean))];
  localStorage.setItem(STORAGE_KEYS, JSON.stringify(clean));
  return clean;
};

/* -------------------- نداء Gemini -------------------- */
const callGemini = async (prompt, systemInstruction = "", imageDataBase64 = null) => {
  const keys = getApiKeys();
  if (keys.length === 0) {
    return "⚠️ لم يتم إضافة مفتاح API بعد.\nاضغط على زر الإعدادات ⚙️ (أعلى الصفحة) وأضف مفتاح Google Gemini الخاص بك، ثم أعد المحاولة.";
  }

  const baseSystemPrompt =
    'أنت مساعد ذكي وطبيب خبير متواجد في منصة MedAI. ' +
    'قاعدة صارمة: أجب فقط على الأسئلة الطبية والدراسية. ' +
    'غير ذلك أجب بـ: "عذراً دكتور، تمت برمجتي للإجابة على الأسئلة الطبية والدراسية فقط." ' +
    systemInstruction;

  let lastError = "خطأ غير معروف";

  for (let k = 0; k < keys.length; k++) {
    const key = keys[k];
    for (let m = 0; m < MODELS.length; m++) {
      const model = MODELS[m];
      try {
        const url =
          "https://generativelanguage.googleapis.com/v1beta/models/" +
          model + ":generateContent?key=" + encodeURIComponent(key);

        const parts = [{ text: prompt }];
        if (imageDataBase64) {
          parts.push({
            inlineData: {
              mimeType: "image/jpeg",
              data: imageDataBase64.split(",")[1]
            }
          });
        }

        const res = await fetch(url, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            contents: [{ role: "user", parts: parts }],
            systemInstruction: { parts: [{ text: baseSystemPrompt }] },
            generationConfig: { temperature: 0.7, maxOutputTokens: 2048 }
          })
        });

        if (!res.ok) {
          const errText = await res.text();
          lastError = "HTTP " + res.status;

          // مفتاح غير صالح → انتقل للمفتاح التالي مباشرة
          if (/API key not valid|API_KEY_INVALID|permission denied/i.test(errText)) {
            break;
          }
          // خطأ في الموديل → جرّب الموديل التالي
          continue;
        }

        const data = await res.json();
        const cand = data && data.candidates && data.candidates[0];
        let text = "";
        if (cand && cand.content && cand.content.parts) {
          text = cand.content.parts.map(p => p.text || "").join("");
        }
        if (text && text.trim()) return text.trim();

        lastError = "لم يُرجع النموذج أي نص";
      } catch (err) {
        lastError = err && err.message ? err.message : String(err);
      }
    }
  }

  return "عذراً دكتور، حدث خطأ أثناء الاتصال بالخادم.\n(" + lastError + ")\n\nتأكد من صحة مفتاح API ومن اتصالك بالإنترنت.";
};

const fileToBase64 = (file) =>
  new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.readAsDataURL(file);
    reader.onload = () => resolve(reader.result);
    reader.onerror = (e) => reject(e);
  });

/* ============================================================
   نافذة الإعدادات
   ============================================================ */
const SettingsModal = ({ onClose }) => {
  const [text, setText] = useState(readStoredKeys().join("\n"));
  const [saved, setSaved] = useState(false);
  const [show, setShow] = useState(false);

  const handleSave = () => {
    saveApiKeys(text.split(/[\n,;]+/));
    setSaved(true);
    setTimeout(() => {
      setSaved(false);
      onClose();
    }, 800);
  };

  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/40 backdrop-blur-sm fade-in">
      <div className="glass-card w-full max-w-lg p-7 scale-in bg-white">
        <div className="flex items-center justify-between mb-5">
          <h3 className="text-2xl font-extrabold text-slate-800">
            <i className="fa-solid fa-gear text-blue-600 ml-2"></i> الإعدادات
          </h3>
          <button
            onClick={onClose}
            className="w-9 h-9 rounded-full bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold"
          >
            ✕
          </button>
        </div>

        <p className="text-slate-500 text-sm mb-3 leading-relaxed">
          أضف مفتاح <span className="font-bold text-blue-600">Google Gemini API</span> الخاص بك.
          يمكنك وضع أكثر من مفتاح (كل مفتاح في سطر) وسيتم التبديل بينها تلقائياً عند نفاد الحصة.
        </p>

        <a
          href="https://aistudio.google.com/app/apikey"
          target="_blank"
          rel="noreferrer"
          className="inline-block mb-4 text-sm font-bold text-blue-600 hover:underline"
        >
          <i className="fa-solid fa-arrow-up-right-from-square ml-1"></i>
          احصل على مفتاح مجاني من Google AI Studio
        </a>

        <div className="relative">
          <textarea
            value={text}
            onChange={(e) => setText(e.target.value)}
            placeholder={"AIzaSy...........\nAIzaSy..........."}
            rows={5}
            spellCheck={false}
            className="w-full glass-input px-4 py-3 rounded-xl text-sm font-mono ltr:text-left"
            style={{ direction: "ltr", textAlign: "left", letterSpacing: show ? "normal" : "2px" }}
          />
          <button
            type="button"
            onClick={() => setShow(!show)}
            className="absolute bottom-3 left-3 text-slate-400 hover:text-blue-600 text-sm"
            title={show ? "إخفاء" : "إظهار"}
          >
            <i className={"fa-solid " + (show ? "fa-eye-slash" : "fa-eye")}></i>
          </button>
        </div>

        <div className="flex gap-3 mt-6">
          <button
            onClick={handleSave}
            className="flex-1 py-3 rounded-xl bg-gradient-to-r from-blue-600 to-indigo-600 text-white font-bold shadow-lg hover:shadow-blue-500/40 transition-all"
          >
            {saved ? "✔ تم الحفظ" : "حفظ المفاتيح"}
          </button>
          <button
            onClick={() => { setText(""); }}
            className="px-5 py-3 rounded-xl bg-slate-100 text-slate-600 font-bold hover:bg-slate-200"
          >
            تفريغ
          </button>
        </div>

        <p className="text-[11px] text-slate-400 mt-4 leading-relaxed text-center">
          🔒 تُحفظ المفاتيح في متصفحك فقط (localStorage) ولا تُرسل لأي جهة غير Google.
        </p>
      </div>
    </div>
  );
};

/* ============================================================
   شاشة تسجيل الدخول
   ============================================================ */
const LoginScreen = ({ onLogin, onOpenSettings }) => {
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [error, setError] = useState("");

  const handleSubmit = (e) => {
    e.preventDefault();
    if (!email.trim() || !password.trim()) {
      setError("يرجى إدخال البريد وكلمة المرور");
      return;
    }
    onLogin({ name: email.split("@")[0] || "طبيب" });
  };

  return (
    <div className="min-h-screen flex flex-col items-center justify-center p-4 relative z-10 fade-in">
      <div className="glass-card p-8 sm:p-10 w-full max-w-md relative overflow-hidden scale-in bg-white/85">
        <div className="text-center mb-8">
          <div className="flex justify-center mb-6">
            <div className="w-24 h-24 bg-gradient-to-br from-blue-500 to-indigo-600 rounded-3xl flex items-center justify-center shadow-lg floating text-white text-4xl">
              <i className="fa-solid fa-brain"></i>
            </div>
          </div>
          <h1 className="text-3xl sm:text-4xl font-extrabold bg-clip-text text-transparent bg-gradient-to-r from-blue-700 to-purple-600">
            MedAI Platform
          </h1>
          <p className="text-slate-500 mt-3 text-sm font-medium">
            المنصة الطبية الأذكى والأرقى لطلاب الطب
          </p>
        </div>

        <form onSubmit={handleSubmit} className="space-y-5">
          <div>
            <label className="block text-sm font-semibold text-slate-700 mb-2">البريد الجامعي</label>
            <input
              type="email"
              required
              className="w-full glass-input px-5 py-3.5 rounded-xl text-lg"
              placeholder="student@med.edu"
              value={email}
              onChange={(e) => setEmail(e.target.value)}
            />
          </div>
          <div>
            <label className="block text-sm font-semibold text-slate-700 mb-2">كلمة المرور</label>
            <input
              type="password"
              required
              className="w-full glass-input px-5 py-3.5 rounded-xl text-lg"
              placeholder="••••••••"
              value={password}
              onChange={(e) => setPassword(e.target.value)}
            />
          </div>

          {error && (
            <div className="text-red-600 text-sm font-bold bg-red-50 border border-red-100 rounded-xl px-4 py-2">
              {error}
            </div>
          )}

          <button
            type="submit"
            className="w-full py-4 mt-2 rounded-xl bg-gradient-to-r from-blue-600 to-indigo-600 text-white font-bold text-lg shadow-lg hover:shadow-blue-500/40 transition-all active:scale-[0.98]"
          >
            تسجيل الدخول
          </button>
        </form>

        <button
          onClick={onOpenSettings}
          className="w-full mt-4 py-3 rounded-xl bg-slate-100 text-slate-600 font-bold hover:bg-slate-200 transition-all text-sm"
        >
          <i className="fa-solid fa-gear ml-2"></i> إعداد مفتاح API
        </button>

        <div className="mt-8 text-center border-t border-slate-200 pt-5">
          <p className="text-sm text-slate-500">
            <span>تطوير وتصميم بكل فخامة بواسطة </span>
            <span className="font-extrabold text-blue-600 text-lg">يمان قدحات Yaman Gadhat</span>
          </p>
        </div>
      </div>
    </div>
  );
};

/* ============================================================
   شاشة الترحيب
   ============================================================ */
const OnboardingScreen = ({ user, onComplete }) => {
  const [step, setStep] = useState(1);
  const [year, setYear] = useState("");
  const [advice, setAdvice] = useState("");
  const [loadingAdvice, setLoadingAdvice] = useState(false);

  const years = ["سنة أولى", "سنة ثانية", "سنة ثالثة", "سنة رابعة", "سنة خامسة", "سنة سادسة"];

  const handleYearSelect = async (selectedYear) => {
    setYear(selectedYear);
    setStep(2);
    setLoadingAdvice(true);
    try {
      const prompt =
        "طالب طب في " + selectedYear + ". أعطه نصيحتين ذهبيتين قصيرتين للدراسة، بالعربية وبنقاط واضحة.";
      const response = await callGemini(prompt);
      setAdvice(response);
    } catch (e) {
      setAdvice("تعذّر جلب النصائح حالياً، لكن رحلتك جاهزة! 🚀");
    }
    setLoadingAdvice(false);
  };

  return (
    <div className="min-h-screen flex flex-col items-center justify-center p-4 relative z-10 fade-in">
      <div className="glass-card p-8 sm:p-10 w-full max-w-2xl text-center slide-up bg-white/85">
        {step === 1 && (
          <div>
            <h2 className="text-2xl sm:text-3xl font-extrabold mb-4 text-slate-800">
              أهلاً بك دكتور <span className="text-blue-600">{user.name}</span> 👋
            </h2>
            <p className="text-slate-500 mb-8 text-lg">في أي سنة دراسية أنت؟</p>
            <div className="grid grid-cols-2 md:grid-cols-3 gap-4">
              {years.map((y, idx) => (
                <button
                  key={idx}
                  onClick={() => handleYearSelect(y)}
                  className="p-4 rounded-2xl border-2 border-slate-100 text-slate-700 bg-white hover:border-blue-500 hover:bg-blue-50 font-bold text-lg shadow-sm transition-all active:scale-95"
                >
                  {y}
                </button>
              ))}
            </div>
          </div>
        )}

        {step === 2 && (
          <div>
            <h2 className="text-2xl font-bold text-slate-800 mb-6">نصائح مخصصة لدفعتك:</h2>
            {loadingAdvice ? (
              <div className="flex flex-col items-center py-10 gap-4">
                <div className="loader w-10 h-10"></div>
                <span className="text-slate-400 text-sm font-bold">جاري تحضير النصائح...</span>
              </div>
            ) : (
              <div className="bg-slate-50 p-6 rounded-2xl border text-right mb-8 text-slate-700 font-medium whitespace-pre-line leading-loose">
                {advice}
              </div>
            )}
            <button
              onClick={() => onComplete({ ...user, year })}
              disabled={loadingAdvice}
              className="px-10 py-4 rounded-2xl bg-blue-600 text-white font-bold text-lg shadow-lg hover:bg-blue-700 transition-all disabled:opacity-50 active:scale-95"
            >
              ابدأ رحلتك 🚀
            </button>
          </div>
        )}
      </div>
    </div>
  );
};

/* ============================================================
   المساعد الذكي
   ============================================================ */
const AIChat = ({ user }) => {
  const [messages, setMessages] = useState([
    {
      role: "model",
      text: "أهلاً بك دكتور " + user.name + " 👋\nجاهز لمساعدتك في مواد " + user.year + " الطبية. اسألني عن أي موضوع."
    }
  ]);
  const [input, setInput] = useState("");
  const [loading, setLoading] = useState(false);
  const chatEndRef = useRef(null);
  const inputRef = useRef(null);

  useEffect(() => {
    if (chatEndRef.current) {
      chatEndRef.current.scrollIntoView({ behavior: "smooth", block: "end" });
    }
  }, [messages, loading]);

  const handleSend = async () => {
    const text = input.trim();
    if (!text || loading) return;

    setMessages((prev) => [...prev, { role: "user", text }]);
    setInput("");
    setLoading(true);

    try {
      const aiResponse = await callGemini(text, "الطالب في " + user.year + ".");
      setMessages((prev) => [...prev, { role: "model", text: aiResponse }]);
    } catch (e) {
      setMessages((prev) => [
        ...prev,
        { role: "model", text: "عذراً دكتور، حدث خطأ غير متوقع. حاول مرة أخرى." }
      ]);
    }
    setLoading(false);
    if (inputRef.current) inputRef.current.focus();
  };

  const handleKeyDown = (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      handleSend();
    }
  };

  const clearChat = () => {
    setMessages([
      { role: "model", text: "تم بدء محادثة جديدة ✨ تفضل بسؤالك دكتور " + user.name + "." }
    ]);
  };

  return (
    <div className="flex flex-col h-full glass-card overflow-hidden border bg-white/70">
      {/* الهيدر */}
      <div className="bg-white/90 p-4 sm:p-5 border-b flex items-center justify-between gap-3 flex-wrap">
        <div className="flex items-center gap-3">
          <div className="w-10 h-10 rounded-xl bg-gradient-to-br from-blue-500 to-indigo-600 text-white flex items-center justify-center">
            <i className="fa-solid fa-stethoscope"></i>
          </div>
          <div>
            <h3 className="font-extrabold text-blue-700 leading-tight">MedAI Tutor</h3>
            <span className="text-xs text-slate-400 font-bold">{user.year}</span>
          </div>
        </div>
        <button
          onClick={clearChat}
          className="text-sm font-bold text-slate-500 hover:text-red-500 bg-slate-100 hover:bg-red-50 px-4 py-2 rounded-xl transition-all"
        >
          <i className="fa-solid fa-rotate-right ml-1"></i> محادثة جديدة
        </button>
      </div>

      {/* الرسائل */}
      <div className="flex-1 overflow-y-auto p-4 sm:p-6 space-y-4 bg-slate-50/50">
        {messages.map((msg, idx) => (
          <div
            key={idx}
            className={
              "flex " + (msg.role === "user" ? "justify-start" : "justify-end")
            }
          >
            <div
              className={
                "max-w-[85%] sm:max-w-[78%] p-4 rounded-2xl text-base sm:text-lg msg-bubble shadow-sm " +
                (msg.role === "user"
                  ? "bg-blue-600 text-white rounded-br-sm"
                  : "bg-white text-slate-700 border border-slate-100 rounded-bl-sm")
              }
            >
              {msg.text}
            </div>
          </div>
        ))}

        {loading && (
          <div className="flex justify-end">
            <div className="bg-white border border-slate-100 rounded-2xl rounded-bl-sm px-5 py-4 shadow-sm">
              <div className="typing-dots">
                <span></span><span></span><span></span>
              </div>
            </div>
          </div>
        )}

        <div ref={chatEndRef} />
      </div>

      {/* الإدخال */}
      <div className="p-3 sm:p-4 border-t bg-white flex gap-2 sm:gap-3">
        <input
          ref={inputRef}
          type="text"
          value={input}
          onChange={(e) => setInput(e.target.value)}
          onKeyDown={handleKeyDown}
          placeholder="اكتب سؤالك الطبي هنا..."
          className="flex-1 glass-input px-4 py-3 rounded-xl text-base sm:text-lg min-w-0"
        />
        <button
          onClick={handleSend}
          disabled={loading || !input.trim()}
          className="px-5 sm:px-7 bg-blue-600 hover:bg-blue-700 disabled:opacity-40 disabled:cursor-not-allowed text-white rounded-xl font-bold transition-all active:scale-95"
        >
          <i className="fa-solid fa-paper-plane"></i>
          <span className="hidden sm:inline mr-2">إرسال</span>
        </button>
      </div>
    </div>
  );
};

/* ============================================================
   الواجهة الرئيسية
   ============================================================ */
const MainApp = ({ user, onLogout, onOpenSettings }) => {
  const [activeTab, setActiveTab] = useState("chat");
  const hasKeys = getApiKeys().length > 0;

  return (
    <div className="flex flex-col md:flex-row h-screen overflow-hidden">
      {/* الشريط الجانبي */}
      <aside className="md:w-72 w-full bg-white border-b md:border-b-0 md:border-l p-4 md:p-6 flex md:flex-col items-center md:items-stretch gap-4 md:gap-0 shrink-0">
        <div className="flex md:flex-col items-center gap-3 md:gap-0 md:text-center md:mb-8 flex-1 md:flex-none">
          <div className="w-12 h-12 md:w-16 md:h-16 md:mx-auto md:mb-2 bg-blue-50 text-blue-600 rounded-2xl flex items-center justify-center text-xl md:text-2xl font-extrabold">
            {(user.name || "ط").charAt(0).toUpperCase()}
          </div>
          <div className="md:mt-0">
            <h2 className="font-extrabold text-base md:text-lg leading-tight">{user.name}</h2>
            <span className="inline-block text-[11px] bg-blue-50 text-blue-600 px-2 py-0.5 rounded-md font-bold">
              {user.year}
            </span>
          </div>
        </div>

        <nav className="hidden md:block flex-1 space-y-2">
          <button
            onClick={() => setActiveTab("chat")}
            className={
              "w-full p-3 rounded-xl font-bold text-right transition-all " +
              (activeTab === "chat"
                ? "bg-blue-600 text-white shadow-lg shadow-blue-500/30"
                : "text-slate-600 hover:bg-slate-100")
            }
          >
            <i className="fa-solid fa-comments ml-2"></i> المساعد الذكي
          </button>
        </nav>

        <div className="flex md:flex-col gap-2 md:gap-2 md:mt-4">
          <button
            onClick={onOpenSettings}
            className={
              "px-4 py-2.5 rounded-xl font-bold text-sm transition-all flex items-center gap-2 justify-center " +
              (hasKeys
                ? "bg-slate-100 text-slate-600 hover:bg-slate-200"
                : "bg-amber-100 text-amber-700 hover:bg-amber-200 animate-pulse")
            }
          >
            <i className="fa-solid fa-gear"></i>
            <span className="hidden sm:inline">{hasKeys ? "الإعدادات" : "أضف مفتاح API"}</span>
          </button>
          <button
            onClick={onLogout}
            className="px-4 py-2.5 rounded-xl bg-red-50 text-red-600 hover:bg-red-100 font-bold text-sm transition-all"
          >
            <i className="fa-solid fa-right-from-bracket"></i>
            <span className="hidden sm:inline mr-2">خروج</span>
          </button>
        </div>

        <div className="hidden md:block text-[11px] text-center text-slate-400 mt-4">
          تطوير: يمان قدحات
        </div>
      </aside>

      {/* المحتوى */}
      <main className="flex-1 min-h-0 p-3 sm:p-6 flex flex-col">
        {!hasKeys && (
          <div className="mb-3 bg-amber-50 border border-amber-200 text-amber-800 rounded-2xl px-4 py-3 text-sm font-bold flex items-center gap-2 fade-in">
            <i className="fa-solid fa-triangle-exclamation"></i>
            <span>لم تضف مفتاح API بعد — اضغط على «الإعدادات» وأضف مفتاح Gemini ليعمل المساعد.</span>
          </div>
        )}
        <div className="flex-1 min-h-0">
          {activeTab === "chat" && <AIChat user={user} />}
        </div>
      </main>
    </div>
  );
};

/* ============================================================
   التطبيق
   ============================================================ */
function App() {
  const [appState, setAppState] = useState("login");
  const [user, setUser] = useState(null);
  const [settingsOpen, setSettingsOpen] = useState(false);
  const [booted, setBooted] = useState(false);

  // استرجاع الجلسة السابقة
  useEffect(() => {
    try {
      const saved = JSON.parse(localStorage.getItem(STORAGE_USER) || "null");
      if (saved && saved.name && saved.year) {
        setUser(saved);
        setAppState("main");
      }
    } catch (e) {}
    setBooted(true);
  }, []);

  const handleLogin = (u) => {
    setUser(u);
    setAppState("onboarding");
  };

  const handleOnboardingComplete = (u) => {
    setUser(u);
    localStorage.setItem(STORAGE_USER, JSON.stringify(u));
    setAppState("main");
  };

  const handleLogout = () => {
    localStorage.removeItem(STORAGE_USER);
    setUser(null);
    setAppState("login");
  };

  if (!booted) {
    return (
      <div className="min-h-screen flex items-center justify-center">
        <div className="loader w-12 h-12"></div>
      </div>
    );
  }

  return (
    <>
      <div className="bg-animated"></div>

      {appState === "login" && (
        <LoginScreen onLogin={handleLogin} onOpenSettings={() => setSettingsOpen(true)} />
      )}

      {appState === "onboarding" && user && (
        <OnboardingScreen user={user} onComplete={handleOnboardingComplete} />
      )}

      {appState === "main" && user && (
        <MainApp
          user={user}
          onLogout={handleLogout}
          onOpenSettings={() => setSettingsOpen(true)}
        />
      )}

      {settingsOpen && <SettingsModal onClose={() => setSettingsOpen(false)} />}
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
